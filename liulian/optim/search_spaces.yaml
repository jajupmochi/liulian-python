# HPO search-space config for the entity-identifier matrix (lstm / dlinear / patchtst).
#
# Why a config file: the search space is data the front-end should be able to
# DISPLAY and EDIT without touching Python. `resolve_search_space()` in
# search_spaces.py reads this file and composes the final Ray Tune space.
# Models NOT listed here fall back to the Python registry in search_spaces.py.
#
# Sampler spec grammar (each leaf is one of):
#   {dist: choice,     values: [...]}        -> ray.tune.choice
#   {dist: uniform,    low: a, high: b}      -> ray.tune.uniform(a, b)
#   {dist: loguniform, low: a, high: b}      -> ray.tune.loguniform(a, b)
#   {dist: randint,    low: a, high: b}      -> ray.tune.randint(a, b)   # high EXCLUSIVE
#
# Composition: final space = model_spaces[<resolved key>]  +  identifier_spaces[<mode>]
#   - identifier params are added per `identifier_mode` (mode-aware).
#   - SPECIAL CASE: patchtst + embedding + id_integration=add_after_patch does NOT
#     add embedding_size (the internal embedding is fixed to d_model).
# This is what fixes the historical bug where `none` still tuned `embedding_size`.

# --------------------------------------------------------------------------- #
# Base model HP spaces — NO identifier params here (those compose in below).   #
# --------------------------------------------------------------------------- #
model_spaces:

  # LSTM on swiss-river. Ranges follow the swiss-river-network benchmark
  # ray_tune.py (search_space_lstm): hidden_size->d_model, num_layers->e_layers.
  # ref: https://github.com/jajupmochi/swiss-river-network-benchmark/blob/main/swissrivernetwork/benchmark/ray_tune.py
  lstm_swiss:
#    batch_size:    {dist: randint, low: 32, high: 257}     # ref: randint(32, 257)
    learning_rate: {dist: loguniform, low: 0.0001, high: 0.005}  # ref lstm uses 1e-4 low; 1e-5 keeps the prior anchored range
    d_model:       {dist: randint, low: 16, high: 257}     # ref hidden_size: randint(16, 129)
    e_layers:      {dist: randint, low: 1, high: 4}        # ref num_layers: randint(1, 4)
    # ref LstmModel has NO dropout; ours applies config dropout (lstm.py:49)
    # between layers AND on the head. Tune {0, 0.1} so HPO can pick the
    # reference behaviour (0) or our previous default (0.1).
    dropout:       {dist: choice, values: [0.0, 0.1]}

  # LSTM on other datasets (traffic/electricity, multi_channel). Discrete ranges.
  lstm_general:
#    batch_size:    {dist: choice, values: [32, 64, 128, 256]}
    learning_rate: {dist: loguniform, low: 0.0001, high: 0.005}
    d_model:       {dist: randint, low: 16, high: 257}
    e_layers:      {dist: randint, low: 1, high: 4}
    dropout:       {dist: choice, values: [0.0, 0.1, 0.2, 0.3]}

  # DLinear on swiss-river (multi_channel). batch_size FIXED at 32 (user
  # decision 2026-06-14: match the swiss lstm so the cross-model comparison
  # is clean) -> NOT in the space, taken from the config. DLinear is a pure
  # linear decomposition model: moving_avg (decomp kernel) is its only
  # architecture knob (no dropout / d_model / attention).
  dlinear_swiss:
    learning_rate: {dist: loguniform, low: 0.0001, high: 0.005}
    moving_avg:    {dist: choice, values: [13, 25, 51]}

  # PatchTST on swiss-river (multi_channel). batch_size FIXED at 32 (same
  # reason); patch_len/stride FIXED at 16/8 (TSL standard, not tuned).
  patchtst_swiss:
    learning_rate: {dist: loguniform, low: 0.0001, high: 0.001}
    d_model:       {dist: choice, values: [128, 256, 512]}
    d_ff:          {dist: choice, values: [256, 512, 2048]}
    n_heads:       {dist: choice, values: [2, 4, 8, 16]}
    e_layers:      {dist: choice, values: [1, 2, 3]}
    dropout:       {dist: choice, values: [0.1, 0.2]}

  # Time-LLM on swiss-river (per_entity, channel-independent N=1). CENTERED on
  # the Time-LLM authors' canonical values (ETTh1 run script: d_model 32,
  # d_ff 128, n_heads 8, llm_layers 6, lr 0.01) and each canonical value is
  # INCLUDED in its grid, so HPO can recover the paper config or scale away
  # from it. Deliberately SPARSE (3x3x2x2 = 36 points, ASHA prunes early) —
  # the axes probe theoretical boundaries and dataset/model scaling, not a
  # dense sweep.
  #   - d_model / d_ff: capacity + reprogramming/head width (highest impact).
  #   - learning_rate: {1e-3, 1e-2}; canonical 1e-2 plus the epoch-diagnostic
  #     winner 1e-3 (swiss single-channel prefers the lower rate). 1e-3 also
  #     overlaps the PatchTST-swiss upper bound -> partial cross-model alignment.
  #   - llm_layers: {3, 6} probes "how much frozen LLM" the TS task needs.
  # NOT tuned (SHARED with LSTM/PatchTST for a fair comparison, taken from the
  # config): batch_size 32, seq_len 90, pred_len 7, patch_len 16, stride 8,
  # train_epochs 30 + early stopping. n_heads fixed at the canonical 8 (low
  # impact). factor is a DEAD knob for Time-LLM and is never tuned.
  # ref: https://github.com/KimMeen/Time-LLM (scripts/TimeLLM_ETTh1.sh)
  timellm_swiss:
    learning_rate: {dist: choice, values: [0.001, 0.01]}   # canonical 0.01 + diagnostic-best 0.001
    d_model:       {dist: choice, values: [16, 32, 64]}    # canonical 32; capacity scaling
    d_ff:          {dist: choice, values: [32, 128, 256]}  # canonical 128; reprogramming/head width
    # 12 = FULL GPT-2 depth (paper Table 6: GPT-2(12) beats GPT-2(6) by 2.7% on THEIR
    # benchmarks; FSCA found 4-6 optimal — contested, so let validation decide). Only
    # meaningful for backbones with >= 12 layers; the current matrix runs GPT2 (12 total).
    # NOTE cluster sync deferred: do NOT change the space mid-run — apply at the next
    # Tier boundary (running Tier-0 cells sampled from {3,6}).
    llm_layers:    {dist: choice, values: [3, 6, 12]}      # canonical 6; full GPT-2 12

  # DLinear — must EXACTLY mirror dlinear_space() to preserve anchored baselines.
  # batch_size stays TUNED here: the 2026-05 traffic/electricity baselines were
  # produced with it, and TSL_REQUIRED_HPARAMS (matrix.py) enforces coverage.
  dlinear:
    batch_size:    {dist: choice, values: [16, 32, 64, 128]}
    learning_rate: {dist: loguniform, low: 0.0001, high: 0.005}
    moving_avg:    {dist: choice, values: [13, 25, 51]}

  # PatchTST — must EXACTLY mirror patchtst_space() to preserve anchored baselines.
  # batch_size stays TUNED (same reason as dlinear above).
  patchtst:
    batch_size:    {dist: choice, values: [16, 32, 64, 128]}
    learning_rate: {dist: loguniform, low: 0.0001, high: 0.005}
    d_model:       {dist: choice, values: [128, 256, 512]}
    d_ff:          {dist: choice, values: [256, 512, 2048]}
    n_heads:       {dist: choice, values: [2, 4, 8, 16]}
    e_layers:      {dist: choice, values: [1, 2, 3]}
    dropout:       {dist: choice, values: [0.1, 0.2]}

# --------------------------------------------------------------------------- #
# Identifier-mode params, composed on top of the base space (mode-aware).      #
# --------------------------------------------------------------------------- #
identifier_spaces:
  none:        {}                                          # baseline — no identifier params
  onehot:      {}                                          # dim = #stations (fixed, not tunable)
  coordinates: {}                                          # dim = 2 (lat/lon, fixed)
  embedding:
    embedding_size: {dist: randint, low: 1, high: 31}      # ref: randint(1, 31). Skipped for patchtst+add_after_patch.

  # sinusoidal_dim / random_identifier_dim are REAL inner-HPO knobs in BOTH
  # split modes (since 2026-06-12): multi_channel rebuilds the
  # ChannelTransparentWrapper per trial; per_entity REBUILDS THE DATA LOADERS
  # per trial (the feature is baked into the windows) and re-syncs enc_in —
  # see make_trainable(loaders_factory=...) in optim/ray_optimizer.py and the
  # post-HPO rebuild in runtime/experiment.py. The CASE-2 outer sweep (ledger
  # item #26) remains for systematic dim-vs-metrics curves at a fixed budget.
  sinusoidal:
    sinusoidal_dim:        {dist: randint, low: 1, high: 31}
  random:
    random_identifier_dim: {dist: randint, low: 1, high: 31}

  # Time-LLM soft-prompt mode (a learned prefix prepended to the reprogrammed
  # patch tokens). soft_prompt_len is the ONLY soft-prompt-specific knob; the
  # prefix width is llm_dim (fixed by the backbone), so it is not tuned. Only
  # Time-LLM uses this identifier_mode, so the key is inert for other models.
  soft_prompt:
    soft_prompt_len:       {dist: choice, values: [4, 8, 16]}
  # Time-LLM numeric-embedding sub-variants map to these identifier_mode
  # strings (see run_matrix._A2_TO_IDENTIFIER). They add NO tunable dim: the
  # embedding/onehot/sinusoidal identity is projected to d_model, so the width
  # is tied to d_model (tuned in the model space), not a standalone knob.
  # Declared here as {} so the composition is explicit rather than a silent
  # dict-miss default. embedding is handled by the skip logic in
  # _resolve_from_yaml (dead-knob guard); the rest are naturally empty.
  random_embedding:     {}
  onehot_embedding:     {}
  sinusoidal_embedding: {}
  entity_description:   {}   # text identity — fixed description, nothing to tune
  text_embedding:       {}   # frozen-LLM text embedding, projected to d_model

# --------------------------------------------------------------------------- #
# Resolution: (data prefix, model) -> base space key. Mode-INDEPENDENT.        #
# First match wins. Omit `data` to match any dataset.                          #
# --------------------------------------------------------------------------- #
resolution:
  - {data: swiss-river, model: lstm,     space: lstm_swiss}
  - {data: swiss-river, model: dlinear,  space: dlinear_swiss}
  - {data: swiss-river, model: patchtst, space: patchtst_swiss}
  - {data: swiss-river, model: timellm,  space: timellm_swiss}
  - {model: lstm,                         space: lstm_general}
  - {model: dlinear,                      space: dlinear}
  - {model: patchtst,                     space: patchtst}
