# Per-channel / per-station natural-language entity descriptions for the Time-LLM
# H4 `entity_description` identifier mode (--identifier_mode entity_description).
#
# Keyed by --data. Each value is a list of descriptions, ONE PER ENTITY, index-
# aligned with the entity id the loader exposes:
#   * ETTh1  -> one per channel (feat_id 0..6, channel-independent loader).
#   * swiss-river-1990 -> one per station (embedding_idx 0..27, the row order of
#     graph_swiss-1990.pth).
# The model's _resolve_entity_descs validates each per-sample id against this
# list length at forward time (fail-loud), so a wrong-length table is caught.
#
# This is the genuinely novel, Time-LLM-only identifier rung: the description text
# enters the LLM's natural-language prompt and is grounded by its pretrained world
# knowledge (no other forecaster in the matrix can use it).

# ETTh1 — the 7 Electricity Transformer Temperature channels (Zhou et al.,
# Informer, AAAI 2021). Order = HUFL, HULL, MUFL, MULL, LUFL, LULL, OT.
# NOTE: these 7 channels are all ONE transformer's measurements (not distinct
# entities) — a weak "entity" test; multi-seed result was null (see doc §6.6).
ETTh1:
  - "High UseFul Load on an electricity transformer"
  - "High UseLess Load on an electricity transformer"
  - "Middle UseFul Load on an electricity transformer"
  - "Middle UseLess Load on an electricity transformer"
  - "Low UseFul Load on an electricity transformer"
  - "Low UseLess Load on an electricity transformer"
  - "Oil Temperature of an electricity transformer"

# swiss-river-1990 — 28 real FOEN/BAFU river gauging stations. Index-aligned with
# embedding_idx (graph_swiss-1990.pth row order). River + town fetched from
# hydrodaten.admin.ch; lat/lon converted from CH1903 coordinates. These are REAL
# Swiss rivers (Rhine/Rhein, Aare, Reuss, Rhône, Limmat, …) at named towns — the
# entity-rich domain H4 is designed for. Threaded per-sample via the swiss
# ConcatDataset wrapper (_SwissStationIdDataset in run_experiment.py).
