# Time-LLM DEBUG config — a self-contained, fast HPO run for stepping through the
# REAL pipeline + HPO code path. Aligned with experiments/hydro_llm/configs/timellm_config.yaml
# (the authoritative-reference config), only shrunk for speed and switched into HPO mode.
#
# Load it through the REAL matrix entry (run_matrix.py --config), NO custom script.
# run_matrix's --phase controls HPO on/off, so use --phase full to exercise the HPO
# path; train_epochs / max_train_samples / hpo settings below are the fast base and
# survive unless a CLI flag overrides them:
#
#     python experiments/hydro_llm/run_matrix.py --config experiments/hydro_llm/configs/debug.yaml \
#         --phase full --arch timellm --datasets swiss-river-1990 --modes none \
#         --seeds 2026 --hpo-num-samples 2
#
# (Also loadable via the single-run entry: python experiments/run.py --config
#  experiments/hydro_llm/configs/debug.yaml — there the hpo: settings below apply as-is.)
#
# In PyCharm: Script = experiments/hydro_llm/run_matrix.py, Parameters = the args
# after "run_matrix.py" above; Env = HF_HUB_OFFLINE=1;TRANSFORMERS_OFFLINE=1;
# working dir = repo root; interpreter = .venv.
#
# Breakpoints hit (main process — run_matrix uses in-process execution):
# run_matrix cell build, build_overrides, run_with_config, run_experiment,
# build_optimizer, resolve_search_space, and the post-HPO rebuild+retrain
# (build_model / timellm.forecast / trainer.fit). The per-trial Ray trials run in
# worker processes (Ray 2.x), so breakpoints INSIDE a trial do not hit there — but
# a trial runs the SAME build_model/forecast/fit as the post-HPO retrain, so
# breakpoint those in the retrain. To hit the model/train code IMMEDIATELY without
# HPO, run the same command with --phase dev (real pipeline, no HPO, direct train).
#
# Switch the branch under test with --modes / --a2 (or identifier_mode: below).

# ── General ─────────────────────────────────────────────────────────────
model: timellm
# bf16 MIXED precision, matching Time-LLM-official exactly: their runs go through
# `accelerate launch --mixed_precision bf16` (scripts/TimeLLM_ETTh1.sh L14) +
# ds_config_zero2.json {"bf16":{"enabled":true,"auto_cast":true}} — compute in
# bfloat16, fp32 master weights, no GradScaler. Implemented as torch.autocast in
# ForecastTrainer (or handed to accelerate when use_accelerator=true).
# CLUSTER SYNC RULE: apply only at a Tier boundary — never mid-tier, or cells of
# the same comparison would mix precisions (same policy as search-space edits).
precision: bf16
# ── Parallelization (designed, INERT — do not enable inside Ray HPO) ─────
# Time-LLM's tool is HF Accelerate + DeepSpeed ZeRO-2. Wired in
# liulian/runtime/accelerator.py + trainer; OFF by default. Reserved for
# single-run big-model cells (LLAMA arm / post-HPO retrain) launched via
# `accelerate launch` OUTSIDE Ray — Ray parallelizes across trials and does
# not compose with accelerate's multi-process launch (see 01-ARCHITECTURE-SPEC §6.5).
# use_accelerator: true
# deepspeed_config: experiments/hydro_llm/configs/ds_config_zero2.json
# 2026 = the project matrix standard (matrix.DEFAULT_SEEDS, default_config.yaml).
# Time-LLM must share this seed with LSTM/PatchTST/DLinear or the cross-model
# comparison is unfair (research-critic Q3). The published Time-LLM harness cells
# used seed 2021 (n=3: 2021/2022/2023); that number is a separate reproduction
# reference, not the value that belongs in this project's unified model table.
seed: 2026
quick_test: false
eval_only: false
phase: full                    # dev | full (HPO on/off)

# ── Data ────────────────────────────────────────────────────────────────
data: swiss-river-1990
seq_len: 90
pred_len: 7
label_len: 0
features: M
train_split: 0.8
max_samples: null
max_train_samples: 64           # DEBUG: tiny cap so a trial is a few seconds (raise for realistic curves)

# ── Task & mode ─────────────────────────────────────────────────────────
task: forecast
split_mode: per_entity
scaler: minmax
use_current_x: true
short_subsequence_method: drop

# ── Identity (start with the clean baseline; switch to test a branch) ────
# none | entity_description | embedding | random_embedding | onehot_embedding |
# sinusoidal_embedding | coordinates_embedding | soft_prompt | text_embedding
identifier_mode: none
id_injection: model
embedding_size: 16
num_embeddings: null
# prompt_richness: default      # for identifier_mode=entity_description: default|minimal|stats

# ── Model architecture (Time-LLM authors' canonical, HPO-centered) ──────
enc_in: 1
dec_in: 1
c_out: 1
d_model: 32
d_ff: 128
n_heads: 8
e_layers: 2
d_layers: 1
patch_len: 16
stride: 8
dropout: 0.1
embed: timeF
activation: gelu
output_attention: false
moving_avg: 25
factor: 1

# ── LLM backbone ────────────────────────────────────────────────────────
llm_model: GPT2               # GPT2 | BERT | LLAMA
llm_dim: 768
llm_layers: 6
prompt_domain: 1              # authored swiss description (was 0 = hardcoded ETT bug)

# ── Training (DEBUG: tiny) ──────────────────────────────────────────────
train_epochs: 2               # DEBUG: 2 epochs per trial
batch_size: 32
eval_batch_size: 32
learning_rate: 0.01
patience: 2
freq: d
loss: MSE
lradj: type1
pct_start: 0.2
use_amp: false

# ── HPO (DEBUG: minimal Ray Tune) ───────────────────────────────────────
# DEDICATED debug grid: single-value d_model/d_ff/llm_layers (smallest = fastest),
# only learning_rate varies so the 2 trials differ. Same composition machinery as
# the real file; never point a real run at it.
search_space_file: experiments/hydro_llm/configs/search_spaces.debug.yaml
hpo: true                     # trigger the REAL HPO code path
hpo_num_samples: 2            # DEBUG: only 2 trials
hpo_scheduler: asha
hpo_grace_period: 1           # DEBUG: ASHA may stop a trial after 1 epoch
hpo_reduction_factor: 2
hpo_resources_cpu: 1
hpo_resources_gpu: 0          # DEBUG on CPU; set 1 if you have a local GPU
hpo_save_checkpoints: false   # DEBUG: skip checkpoint clutter
hpo_local_mode: true          # sequential trials (Ray 2.x: num_cpus=1). NOTE this alone
                              # does NOT make IDE breakpoints hit inside a trial — Ray 2.x
                              # always runs the trainable in a raylet-spawned WORKER process.
# Breakpoints INSIDE the trainable (_trainable / build_model / trainer.fit in a trial):
# uncomment hpo_debug_attach and the worker will REVERSE-CONNECT to PyCharm.
# One-time PyCharm setup:
#   1. Run | Edit Configurations | + | "Python Debug Server"; port 5678.
#   2. pip install pydevd-pycharm~=<your PyCharm build>  (already in .venv; Help|About shows the build)
#   3. START that debug-server run-config (it waits), THEN run run_matrix normally
#      (plain Run is fine — breakpoints are handled by the debug server).
# Fails LOUDLY if the server is not listening. DEV-ONLY: never sync to a cluster config.
# hpo_debug_attach: localhost:5678

# ── Evaluation ──────────────────────────────────────────────────────────
eval_denorm: true
metrics: mse,mae,rmse

# ── System ──────────────────────────────────────────────────────────────
cache_dir: null               # default HF cache (holds GPT-2 weights)
num_workers: 0                # DEBUG: 0 so DataLoader runs in-process (breakpoints)
checkpoints: ./checkpoints/
itr: 1
percent: 100
des: swiss_river_timellm_debug
show_progress: true
